name: Publish package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
      
# Serialized per ref, never cancelled. The immutable -M<n> step below is a
# check-then-act guard: without this, a push and a workflow_dispatch over the
# same commit both probe "absent" and both deploy, and the loser hits the
# release-coordinate conflict the guard exists to avoid. Cancelling instead
# would abort a run mid-deploy.
concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # `workflow_dispatch` above carries no ref restriction, so without this the
    # workflow could be dispatched against any branch holding the file - and
    # check-version would pass, because a feature branch legitimately holds a
    # SNAPSHOT. That deploys unreviewed branch code over the mainline SNAPSHOT to
    # BOTH Maven Central and GitHub Packages, and rebuilds the published docs
    # from it, with nothing in either registry recording where it came from.
    # The `push` trigger is already restricted to main and tags; only the manual
    # path needs closing.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest 
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the immutable -M<n> coordinate published in the last
          # step of this job is the commit count, which a shallow clone cannot
          # compute.
          fetch-depth: 0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - id: check-version
        name: Check if version is SNAPSHOT
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref_type }}" == "tag" && "$VERSION" == *SNAPSHOT ]]; then
            echo "❌ ERROR: Tagged release contains SNAPSHOT version"
            exit 1
          fi
          
          if [[ "${{ github.ref_type }}" == "branch" && "$VERSION" != *SNAPSHOT ]]; then
            echo "❌ ERROR: Push to main requires SNAPSHOT version"
            exit 1
          fi

      - id: install-secret-key
        name: Install GPG secret key
        run: |
          echo -n "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central (Portal)
        run: |
          set -o pipefail
          mvn --batch-mode -Pcentral -Dgpg.passphrase="$GPG_PASSPHRASE" \
              source:jar javadoc:jar -f pom.xml deploy | tee mvn.log

          # For releases, surface the deploymentId so it's easy to find in the Portal UI.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DEP_ID=$(grep -oE 'deploymentId: [a-f0-9-]{36}' mvn.log | awk '{print $2}' | tail -n1)
            {
              echo "### Central Portal Deployment"
              echo ""
              echo "- Version: \`${{ steps.check-version.outputs.version }}\`"
              echo "- Deployment ID: \`${DEP_ID:-not-found}\`"
              echo "- [Open Deployments in Portal](https://central.sonatype.com/publishing/deployments)"
              echo ""
              echo "Click **Publish** next to the deployment to release it to Maven Central."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode -Pgithub source:jar javadoc:jar -f pom.xml deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trigger docs regeneration only after the snapshot/release artifact is published above,
      # so the docs build never resolves a stale interfaces version (the publish runs in a
      # separate workflow and previously raced the build-workflow dispatch).
      # Tag (release) pushes also reach this step and intentionally refresh the `main` docs set
      # (the dispatch targets ref: 'main'); per-tag versioned docs are not produced.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: interfaces-docs-app-token
        with:
          app-id: ${{ vars.INTERFACES_DOCS_APP_ID }}
          private-key: ${{ secrets.INTERFACES_DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            interface-documentation
      - name: Trigger build OpenAPI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.interfaces-docs-app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'interface-documentation',
              workflow_id: 'publish.yml',
              ref: 'main',
            })

      # Immutable coordinate for the escape hatch: a developer whose unrelated
      # core PR is broken by a mainline snapshot change can pin the last good
      # -M build and keep working. GitHub Packages only, unsigned, no source or
      # javadoc jars - a build pin, not a release.
      #
      # Last step in the job on purpose. A failure here must not be able to
      # abort the interface-documentation dispatch above, which would silently
      # skip the docs rebuild for this merge. Rewriting the pom is safe at this
      # point: check-version already read it and both deploys have completed.
      #
      # Guarded on the ref, not on ref_type. workflow_dispatch accepts any ref
      # carrying this file, and a feature branch legitimately holds a SNAPSHOT,
      # so ref_type == 'branch' let any branch mint an -M from its own commit
      # count. Those numbers overlap main's: a branch at main+1 claims the
      # number the next real merge will compute, that merge then sees the
      # coordinate already present and skips, and no immutable build exists for
      # it - permanently, since the registry refuses to replace a release. That
      # is the silent-wrong failure mode github.run_number was rejected for.
      - name: Publish immutable build version
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_VERSION: ${{ steps.check-version.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="$BASE_VERSION"
          MV="${BASE%-SNAPSHOT}-M$(git rev-list --count HEAD)"

          # -M<n> is a release coordinate and GitHub Packages refuses to replace
          # one, so a re-run on the same commit has to skip rather than fail.
          #
          # Polarity is deliberate: a definite "exists" answer skips, a definite
          # 404 publishes, and anything else warns and FALLS THROUGH to the
          # deploy. Treating the unknown as fatal would invert the guard's whole
          # purpose - if the registry ever answers 3xx (it redirects asset GETs
          # to a pre-signed blob host) or 401/422, every re-run would go red
          # instead of skipping. A redundant deploy attempt costs nothing: the
          # registry's own conflict response is the authority.
          #
          # Not `mvn dependency:get`: it cannot separate an auth failure from a
          # genuine absence, and reports "resolved" for anything already in the
          # local repository. (An earlier version of this comment claimed the
          # pom declares no <repositories> for GitHub Packages - that is wrong,
          # pom.xml does declare one at project level. dependency:get would
          # resolve; it just cannot answer this question reliably.)
          #
          # No -L: curl drops Authorization across hosts, and --location-trusted
          # against the blob host returns a documented 400.
          POM_URL="https://maven.pkg.github.com/omnitrustilm/interfaces/com/otilm/interfaces/$MV/interfaces-$MV.pom"
          CODE=$(curl -sS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' \
                   -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$POM_URL" || echo 000)
          case "$CODE" in
            200|30[0-9]) echo "$MV is already published (HTTP $CODE) - workflow re-run, nothing to do"; exit 0 ;;
            404)         echo "$MV is not present; publishing" ;;
            *)           echo "::warning::Registry probe for $MV returned HTTP $CODE; attempting the deploy and letting the registry decide" ;;
          esac

          # Pinned rather than invoked by the `versions` prefix: an unpinned
          # prefix resolves whatever release Central serves that day and runs it
          # inside a job holding packages: write, and Renovate cannot see a
          # prefix invocation to bump it.
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$MV" -DgenerateBackupPoms=false
          # No source:jar/javadoc:jar and no GPG signing, unlike the Central
          # deploy above. maven.test.skip rather than skipTests - the latter
          # still compiles test sources.
          mvn -B -ntp -Pgithub -Dmaven.test.skip=true \
              -DretryFailedDeploymentCount=3 deploy

          # The counter is an ordinal, not an address - no GitHub URL resolves
          # "the Nth commit". Record the SHA so the number stays traceable to a
          # commit from the place people read the number.
          {
            echo "### Immutable build version"
            echo ""
            echo "\`com.otilm:interfaces:$MV\` - pin this to escape a broken mainline snapshot:"
            echo ""
            echo '```'
            echo "Interfaces-Version: $MV"
            echo '```'
            echo ""
            echo "Built from [\`${GITHUB_SHA:0:8}\`]($SERVER_URL/$REPO/commit/$GITHUB_SHA)."
            echo ""
            echo "Notes: the counter is monotonic and one per push to main, but not"
            echo "gap-free - a release-prep commit carries a non-SNAPSHOT version and"
            echo "fails check-version before this step, so no -M exists for it. Compare"
            echo "these numbers for ordering, not for distance. Publishing a non-SNAPSHOT"
            echo "version also moves \`<release>\`/\`<latest>\` in this registry's Maven"
            echo "metadata onto a milestone build; no consumer uses a version range, but"
            echo "do not read the registry's \"latest\" as a release pointer."
          } >> "$GITHUB_STEP_SUMMARY"
