name: Publish package

on:
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:
      
# Keyed by commit, not ref: the -M<n> step below is check-then-act, so two runs
# over the same commit must serialize. Keying by ref would group every main push,
# and only one run may be pending - a third push cancels the pending one, whose
# commit then gets no -M coordinate. Never cancelled: aborts a run mid-deploy.
concurrency:
  group: publish-package-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch carries no ref restriction; without this, any branch could
    # deploy over the mainline SNAPSHOT to both Maven Central and GitHub Packages
    # and rebuild the published docs from it. Tags stay allowed - check-version
    # hard-fails a tag carrying a SNAPSHOT.
    #
    # Not an authorization boundary: a dispatch runs the workflow file from the ref
    # it targets. Enforcement needs an Environment restricted to main.
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest 
    permissions: 
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history: the -M<n> coordinate in the last step of this job is the commit
          # count, which a shallow clone cannot compute.
          fetch-depth: 0

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - id: check-version
        name: Check if version is SNAPSHOT
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "Project version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.ref_type }}" == "tag" && "$VERSION" == *SNAPSHOT ]]; then
            echo "❌ ERROR: Tagged release contains SNAPSHOT version"
            exit 1
          fi
          
          if [[ "${{ github.ref_type }}" == "branch" && "$VERSION" != *SNAPSHOT ]]; then
            echo "❌ ERROR: Push to main requires SNAPSHOT version"
            exit 1
          fi

      - id: install-secret-key
        name: Install GPG secret key
        run: |
          echo -n "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}

      - name: Publish to Maven Central (Portal)
        run: |
          set -o pipefail
          mvn --batch-mode -Pcentral -Dgpg.passphrase="$GPG_PASSPHRASE" \
              source:jar javadoc:jar -f pom.xml deploy | tee mvn.log

          # For releases, surface the deploymentId so it's easy to find in the Portal UI.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            DEP_ID=$(grep -oE 'deploymentId: [a-f0-9-]{36}' mvn.log | awk '{print $2}' | tail -n1)
            {
              echo "### Central Portal Deployment"
              echo ""
              echo "- Version: \`${{ steps.check-version.outputs.version }}\`"
              echo "- Deployment ID: \`${DEP_ID:-not-found}\`"
              echo "- [Open Deployments in Portal](https://central.sonatype.com/publishing/deployments)"
              echo ""
              echo "Click **Publish** next to the deployment to release it to Maven Central."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Publish to GitHub Packages
        run: mvn --batch-mode -Pgithub source:jar javadoc:jar -f pom.xml deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Trigger docs regeneration only after the snapshot/release artifact is published above,
      # so the docs build never resolves a stale interfaces version (the publish runs in a
      # separate workflow and previously raced the build-workflow dispatch).
      # Tag (release) pushes also reach this step and intentionally refresh the `main` docs set
      # (the dispatch targets ref: 'main'); per-tag versioned docs are not produced.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: interfaces-docs-app-token
        with:
          app-id: ${{ vars.INTERFACES_DOCS_APP_ID }}
          private-key: ${{ secrets.INTERFACES_DOCS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            interface-documentation
      - name: Trigger build OpenAPI
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.interfaces-docs-app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: 'interface-documentation',
              workflow_id: 'publish.yml',
              ref: 'main',
            })

      # Immutable pin for a developer whose unrelated core PR is broken by a mainline
      # snapshot change. GitHub Packages only, unsigned, no source/javadoc jars.
      #
      # Last step in the job: a failure here must not abort the docs dispatch above.
      # Rewriting the pom is safe here - check-version has read it and both deploys
      # have completed.
      #
      # Guarded on the ref, not ref_type: every branch holds a SNAPSHOT and would
      # mint an -M from its own commit count, claiming a number main will later
      # compute - permanently, since the registry refuses to replace a release.
      - name: Publish immutable build version
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_VERSION: ${{ steps.check-version.outputs.version }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          BASE="$BASE_VERSION"
          MV="${BASE%-SNAPSHOT}-M$(git rev-list --count HEAD)"

          # -M<n> is a release coordinate the registry will not replace, so a re-run must
          # skip. 2xx/3xx skips, 404 publishes, anything else warns and falls through -
          # the registry's own conflict response is the authority. Asset GETs redirect to
          # a pre-signed blob host, so 3xx means the version exists.
          #
          # Not dependency:get: a copy in the local repository satisfies it, and it cannot
          # tell an auth failure from an absence. No -L: curl drops Authorization across
          # hosts, and --location-trusted against the blob host returns a documented 400.
          POM_URL="https://maven.pkg.github.com/omnitrustilm/interfaces/com/otilm/interfaces/$MV/interfaces-$MV.pom"
          # curl writes 000 itself on a connection failure; `|| true` is only for set -e.
          CODE=$(curl -sS --retry 3 --retry-connrefused -o /dev/null -w '%{http_code}' \
                   -u "$GITHUB_ACTOR:$GITHUB_TOKEN" "$POM_URL" || true)
          case "$CODE" in
            20[0-9]|30[0-9]) echo "$MV is already published (HTTP $CODE) - workflow re-run, nothing to do"; exit 0 ;;
            404)         echo "$MV is not present; publishing" ;;
            *)           echo "::warning::Registry probe for $MV returned HTTP $CODE; attempting the deploy and letting the registry decide" ;;
          esac

          # Pinned rather than the `versions` prefix, which resolves whatever release
          # Central serves that day and is invisible to Renovate.
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$MV" -DgenerateBackupPoms=false
          # No source/javadoc jars and no GPG signing, unlike the Central deploy above.
          # maven.test.skip also skips test compilation.
          mvn -B -ntp -Pgithub -Dmaven.test.skip=true \
              -DretryFailedDeploymentCount=3 deploy

          # The counter is an ordinal, not an address - no URL resolves the Nth commit,
          # so the SHA is recorded here.
          {
            echo "### Immutable build version"
            echo ""
            echo "\`com.otilm:interfaces:$MV\` - pin this to escape a broken mainline snapshot:"
            echo ""
            echo '```'
            echo "Interfaces-Version: $MV"
            echo '```'
            echo ""
            echo "Built from [\`${GITHUB_SHA:0:8}\`]($SERVER_URL/$REPO/commit/$GITHUB_SHA)."
            echo ""
            echo "This pin stays resolvable for at least 90 days; the weekly cleanup"
            echo "prunes an -M build only once it is both outside the newest 50 and"
            echo "older than that."
            echo ""
            echo "Notes: the counter is monotonic and one per push to main, but not"
            echo "gap-free - a release-prep commit carries a non-SNAPSHOT version and"
            echo "fails check-version before this step, so no -M exists for it. Compare"
            echo "these numbers for ordering, not for distance. Publishing a non-SNAPSHOT"
            echo "version also moves \`<release>\`/\`<latest>\` in this registry's Maven"
            echo "metadata onto a milestone build; no consumer uses a version range, but"
            echo "do not read the registry's \"latest\" as a release pointer."
          } >> "$GITHUB_STEP_SUMMARY"
