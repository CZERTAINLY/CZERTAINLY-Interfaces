name: Build interfaces
on:
  pull_request:
    branches: [main]
    # ready_for_review is not one of the default activity types (opened,
    # synchronize, reopened). Without it the ordinary open-as-draft, iterate,
    # mark-ready flow fires no event once the draft flag clears, so publish-pr
    # below - which skips drafts - would never run for such a PR, and the
    # coupled core PR would find no coordinate and no explanation.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Baseline for every job in this file. `packages: read` is required, not
# decorative: pom.xml declares a <repositories> entry for
# maven.pkg.github.com, which is how the com.otilm parent resolves.
# publish-pr escalates to packages: write in its own block.
permissions:
  contents: read
  packages: read

jobs:
  check:
    if: github.event_name != 'push'
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B verify javadoc:jar -f pom.xml  # javadoc:jar catches broken {@link} refs before they break the publish workflow
  build:
    if: github.event_name != 'pull_request'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B verify -f pom.xml

  publish-pr:
    name: Publish PR snapshot
    needs: check  # never publish an artifact from a PR that fails verify
    # Bots are excluded by PR *author*, not by github.actor. The actor is whoever
    # triggered this particular event, so keying on it misfires both ways: a human
    # pushing a fixup onto a Renovate branch would publish, and a bot-attributed
    # push onto a human's coupled PR would skip - leaving the coordinate stale
    # while the core PR still resolves it. Drafts are excluded because every PR
    # otherwise pays a second full deploy for a coordinate almost none of them
    # need. Fork PRs get a read-only token and cannot publish at all, so a
    # fork-authored breaking change has no coupled flow.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      # Deliberately NOT cancel-in-progress: aborting mid-deploy leaves the
      # package version metadata pointing at a half-uploaded build. Runs are
      # serialized instead, and the stale-head check below stands a superseded
      # run down rather than letting it overwrite newer bytes.
      group: publish-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # The coordinate is mutable - every push republishes the same
      # -alpha-PR<n>-SNAPSHOT - so a run that lost the race must not publish.
      # Job concurrency serializes runs but does not order them by commit
      # freshness: an older commit whose `check` ran slower reaches this job
      # last and would overwrite newer bytes, leaving the coupled core PR green
      # against superseded code with no signal anywhere. Same stand-down as
      # core/.github/workflows/dispatch-preview-docker.yml.
      - id: freshness
        name: Stand down if the PR head has moved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LIVE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$LIVE" != "$RUN_HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER has moved from $RUN_HEAD_SHA to $LIVE; a newer run will publish it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish PR snapshot to GitHub Packages
        if: steps.freshness.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          # The `alpha` qualifier is load-bearing: an unqualified -PR<n>-SNAPSHOT
          # sorts ABOVE the GA release in Maven's ComparableVersion, which would
          # make Renovate offer PR builds to other repos as upgrades.
          PRV="${BASE%-SNAPSHOT}-alpha-PR${PR_NUMBER}-SNAPSHOT"
          echo "Publishing $PRV"
          # Do not run versions:set locally - it rewrites the checked-in pom.xml.
          # Pinned rather than invoked by the `versions` prefix: an unpinned
          # prefix resolves whatever release Central serves that day and runs it
          # inside a job holding packages: write, and Renovate cannot see a
          # prefix invocation to bump it.
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$PRV" -DgenerateBackupPoms=false
          # No source:jar/javadoc:jar and no GPG signing: this coordinate exists
          # only to unblock a coupled core PR and never reaches Maven Central.
          # maven.test.skip rather than skipTests - the latter still compiles
          # test sources, which `check` has already done for this tree.
          mvn -B -ntp -Pgithub -Dmaven.test.skip=true \
              -DretryFailedDeploymentCount=3 deploy
          {
            echo "### PR snapshot published"
            echo ""
            echo "Add this line to the body of the coupled \`core\` PR:"
            echo ""
            echo '```'
            echo "Depends-On: $REPO#${PR_NUMBER}"
            echo '```'
            echo ""
            echo "Coordinate: \`com.otilm:interfaces:$PRV\`"
            echo ""
            echo "Built from the PR **merged into main**, not the branch head:"
            echo "\`actions/checkout\` resolves \`refs/pull/${PR_NUMBER}/merge\` on a"
            echo "\`pull_request\` event, so these bytes can differ from your branch"
            echo "even with no push."
            echo ""
            echo "> The \`Depends-On:\` marker is not read yet - tracking in OmniTrustILM/core#2191."
          } >> "$GITHUB_STEP_SUMMARY"
