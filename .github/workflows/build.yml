name: Build interfaces
on:
  pull_request:
    branches: [main]
    # ready_for_review is not a default activity type; without it, clearing the
    # draft flag fires no event and publish-pr never runs for that PR.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# packages: read is required: pom.xml resolves the com.otilm parent from
# maven.pkg.github.com. publish-pr escalates to packages: write.
permissions:
  contents: read
  packages: read

jobs:
  check:
    if: github.event_name != 'push'
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B verify javadoc:jar -f pom.xml  # javadoc:jar catches broken {@link} refs before they break the publish workflow
  build:
    if: github.event_name != 'pull_request'
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: mvn -B verify -f pom.xml

  publish-pr:
    name: Publish PR snapshot
    needs: check  # never publish an artifact from a PR that fails verify
    # Bots are excluded by PR author, not github.actor - the actor is the pusher,
    # which misfires on a bot push to a human PR and a human push to a bot branch.
    # Drafts are skipped. Fork PRs get a read-only token and cannot publish.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read # the freshness step re-reads the PR head
    concurrency:
      # No cancel-in-progress: aborting mid-deploy leaves the package version
      # metadata on a half-uploaded build. The stale-head check below is the guard.
      group: publish-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # The coordinate is mutable, and job concurrency does not order runs by commit
      # freshness - an older run finishing later would overwrite newer bytes.
      # Same stand-down as core/.github/workflows/dispatch-preview-docker.yml.
      - id: freshness
        name: Stand down if the PR head has moved
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          LIVE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ "$LIVE" != "$RUN_HEAD_SHA" ]; then
            echo "::notice::PR #$PR_NUMBER has moved from $RUN_HEAD_SHA to $LIVE; a newer run will publish it."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish PR snapshot to GitHub Packages
        if: steps.freshness.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BASE=$(mvn -q -B -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          # The `alpha` qualifier is load-bearing: an unqualified -PR<n>-SNAPSHOT sorts
          # ABOVE the GA release in ComparableVersion, so Renovate would offer it.
          PRV="${BASE%-SNAPSHOT}-alpha-PR${PR_NUMBER}-SNAPSHOT"
          echo "Publishing $PRV"
          # Do not run versions:set locally - it rewrites the checked-in pom.xml.
          # Pinned rather than the `versions` prefix, which resolves whatever release
          # Central serves that day and is invisible to Renovate.
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set \
              -DnewVersion="$PRV" -DgenerateBackupPoms=false
          # GitHub Packages only - unsigned, no source/javadoc jars. maven.test.skip
          # also skips test compilation, which `check` has already done.
          mvn -B -ntp -Pgithub -Dmaven.test.skip=true \
              -DretryFailedDeploymentCount=3 deploy
          {
            echo "### PR snapshot published"
            echo ""
            echo "Add this line to the body of the coupled \`core\` PR:"
            echo ""
            echo '```'
            echo "Depends-On: $REPO#${PR_NUMBER}"
            echo '```'
            echo ""
            echo "Coordinate: \`com.otilm:interfaces:$PRV\`"
            echo ""
            echo "Built from the PR **merged into main**, not the branch head:"
            echo "\`actions/checkout\` resolves \`refs/pull/${PR_NUMBER}/merge\` on a"
            echo "\`pull_request\` event, so these bytes can differ from your branch"
            echo "even with no push."
            echo ""
            echo "> The \`Depends-On:\` marker is not read yet - tracking in OmniTrustILM/core#2191."
          } >> "$GITHUB_STEP_SUMMARY"
