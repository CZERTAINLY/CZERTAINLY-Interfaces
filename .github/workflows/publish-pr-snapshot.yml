name: Publish PR snapshot

# Publishes <base>-alpha-PR<n>-SNAPSHOT so a coupled `core` PR can compile
# against an unmerged interfaces change during review.
#
# Its own workflow rather than a job in `Build interfaces`, because that one owns
# the required `Check` context: a label event there would start a run whose verify
# job is skipped, and a skipped job reports success on a required check. Applying
# a routine label to a PR with a failing verify would then satisfy the gate.
#
# `opened` is absent deliberately - a PR created with the label already on it also
# fires `labeled`, so including both would build it twice.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  stage:
    name: Stage PR snapshot
    # Either the label was just applied, or an already-labelled PR got a commit.
    # Testing the label list on every event would also rebuild for unrelated
    # label changes while `publish-snapshot` happens to be present.
    #
    # Not an authorization boundary: labelling needs triage permission, and anyone
    # with it can edit this file in their own PR. Fork PRs get a read-only token
    # regardless, which is what the repository check is for. Dependabot runs get
    # one too, whatever this file requests, so a labelled Dependabot PR would
    # reach the deploy and 401.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'publish-snapshot') ||
        (github.event.action != 'labeled' &&
         contains(github.event.pull_request.labels.*.name, 'publish-snapshot'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'

      # Verified here rather than depending on the `Check` job in the other
      # workflow: `needs:` does not span workflows, so this is what stops a
      # snapshot being published from a PR whose tests fail.
      - name: Verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify javadoc:jar -f pom.xml

      # Staged here so the privileged job never runs Maven against PR-controlled
      # build configuration. Only the jar and a version-rewritten pom cross over.
      - name: Stage the snapshot
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p stage
          # Read with ElementTree, not `mvn help:evaluate`: no parent resolution,
          # so a registry hiccup cannot surface as a bad version.
          BASE=$(python3 -c 'import xml.etree.ElementTree as ET; ns="http://maven.apache.org/POM/4.0.0"; print(ET.parse("pom.xml").getroot().find("{%s}version" % ns).text.strip())')
          PRV="${BASE%-SNAPSHOT}-alpha-PR${PR_NUMBER}-SNAPSHOT"
          cp "target/interfaces-${BASE}.jar" stage/interfaces.jar
          # The staged pom carries the PR coordinate; deploy-file takes the GAV from it.
          PRV="$PRV" python3 -c 'import os, xml.etree.ElementTree as ET; ns="http://maven.apache.org/POM/4.0.0"; ET.register_namespace("", ns); t=ET.parse("pom.xml"); t.getroot().find("{%s}version" % ns).text=os.environ["PRV"]; t.write("stage/pom.xml", xml_declaration=True, encoding="UTF-8")'
          echo "$PRV" > stage/coordinate.txt
          echo "staged $PRV"

      - name: Upload the staged snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-snapshot
          path: stage/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish PR snapshot
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Write access to this repository already implies registry write - the
      # package is repository-scoped, and a push-triggered workflow on any branch
      # can grant itself this token - so this job adds no authorization. What it
      # avoids is running PR-controlled Maven beside the token: no checkout, and
      # only deploy-file, which reads the pom as data.
      packages: write
      pull-requests: read
    concurrency:
      # No cancel-in-progress: aborting mid-deploy leaves the package version
      # metadata on a half-uploaded build. The stand-down below is the guard.
      group: publish-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # No checkout, and deliberately no ~/.m2 cache: the stage job runs
      # PR-controlled Maven, and a restored local repository could carry a planted
      # resolver or plugin jar, which Maven trusts without re-verifying.
      - name: Set up JDK 21
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # Read live, not from the payload. The payload is a snapshot taken when the
      # event fired, so it still says "labelled" after the label is removed, and a
      # re-run replays whatever the original event carried. The coordinate is also
      # mutable, so a run that lost the race must not overwrite newer bytes.
      - id: gate
        name: Stand down if the PR moved, closed, or lost the label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          read -r STATE LIVE LABELS < <(gh api "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '[.state, .head.sha, ([.labels[].name] | join(","))] | @tsv')

          stand_down() { echo "::notice::$1"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; }

          [ "$STATE" = open ] || stand_down "PR #$PR_NUMBER is $STATE; not publishing."
          case ",$LABELS," in
            *,publish-snapshot,*) ;;
            *) stand_down "PR #$PR_NUMBER no longer carries publish-snapshot; not publishing." ;;
          esac
          [ "$LIVE" = "$RUN_HEAD_SHA" ] || stand_down "PR #$PR_NUMBER moved from $RUN_HEAD_SHA to $LIVE; a newer run will publish it."

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download the staged snapshot
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-snapshot
          path: ${{ runner.temp }}/stage

      - name: Publish to GitHub Packages
        if: steps.gate.outputs.publish == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STAGE: ${{ runner.temp }}/stage
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"   # no project here, and .mvn/ discovery walks upwards
          PRV=$(cat "$STAGE/coordinate.txt")

          # Fully qualified and version-pinned: the `deploy:` prefix resolves to
          # whatever Central calls latest, currently a 4.0.0 beta. deploy-file
          # reads the pom as data - no parent resolution, no plugins, no
          # lifecycle. Files named explicitly so nothing in the archive can
          # redirect them.
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
              -Durl=https://maven.pkg.github.com/omnitrustilm/interfaces \
              -DrepositoryId=github \
              -DpomFile="$STAGE/pom.xml" \
              -Dfile="$STAGE/interfaces.jar" \
              -DgeneratePom=false \
              -DretryFailedDeploymentCount=3
          {
            echo "### PR snapshot published"
            echo ""
            echo "\`com.otilm:interfaces:$PRV\`"
            echo ""
            echo "Add to the \`core\` PR body:"
            echo ""
            echo '```'
            echo "Depends-On: $REPO#${PR_NUMBER}"
            echo '```'
            echo ""
            echo "To drop it: merge this PR, then re-run all jobs on the \`core\` PR - the marker"
            echo "clears itself. No body edit, no push."
            echo ""
            echo "> Not read by \`core\` yet - the resolver is not live, so adding the line has no"
            echo "> effect. Until then, override \`interfaces.version\` in \`core/pom.xml\` by hand."
            echo "> Tracking in OmniTrustILM/core#2191."
            echo ""
            echo "<sub>Built from the PR merged into main, not the branch head. Removing the"
            echo "label stops refreshing this coordinate but does not delete it.</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
